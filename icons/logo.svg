<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Arka plan -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Acrylic (Fluent) menü kartı -->
  <g filter="url(#shadow)">
    <rect x="26" y="30" width="64" height="72" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  </g>
  <!-- Menü satırları -->
  <rect x="36" y="42" width="8" height="8" rx="2" fill="#fff" fill-opacity="0.95"/>
  <rect x="50" y="43" width="30" height="6" rx="3" fill="#fff" fill-opacity="0.95"/>
  <rect x="36" y="58" width="8" height="8" rx="2" fill="#fff" fill-opacity="0.8"/>
  <rect x="50" y="59" width="24" height="6" rx="3" fill="#fff" fill-opacity="0.8"/>
  <rect x="36" y="74" width="8" height="8" rx="2" fill="#fff" fill-opacity="0.65"/>
  <rect x="50" y="75" width="28" height="6" rx="3" fill="#fff" fill-opacity="0.65"/>
  <!-- Vurgulu satır -->
  <rect x="32" y="86" width="52" height="10" rx="4" fill="#fff" fill-opacity="0.25"/>
  <!-- İmleç -->
  <path d="M78 76 L104 88 L92 92 L86 104 Z" fill="#fff" stroke="#1e1b4b" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
